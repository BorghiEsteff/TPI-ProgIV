server {
    listen 80;
    server_name _;

    client_max_body_size 15m;

    # Backend Django (REST, GraphQL, Admin, OpenAPI) - elimina prefijo /django
    location /django/ {
        rewrite ^/django/(.*)$ /$1 break;
        proxy_pass http://django-backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;
    }

    # Media y estaticos de Django (portadas subidas y assets admin/DRF)
    location /media/ {
        proxy_pass http://django-backend:8000/media/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ {
        proxy_pass http://django-backend:8000/static/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Backend Node.js (REST notas privadas, IA proxy, GraphQL) - elimina prefijo /node
    location /node/ {
        rewrite ^/node/(.*)$ /$1 break;
        proxy_pass http://node-backend:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;
    }

    # Frontend SPA (React + Vite preview)
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
